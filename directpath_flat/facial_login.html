<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facial Attendance Preview — Directpath EMPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Poppins, sans-serif; background: radial-gradient(ellipse at 25% 50%, rgba(205,30,39,.16), transparent 65%), #0f1117; color: #1a1d26; }
    main { width: min(100%, 460px); padding: 40px; border-radius: 20px; background: #fff; box-shadow: 0 32px 80px #0008; text-align: center; }
    img { width: 54px; height: 54px; object-fit: contain; }
    h1 { margin: 18px 0 8px; font-size: 23px; }
    p { color: #737987; font-size: 14px; line-height: 1.65; }
    .notice { margin: 24px 0; padding: 16px; border-radius: 10px; background: #fef4e1; color: #7a4a00; font-size: 13px; }
    a { display: inline-block; margin-top: 12px; color: #a8181f; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="assets/img/logo.png" alt="Directpath">
    <h1>Facial Attendance</h1>
    <p>Directpath Employee Management and Payroll System</p>
    <div class="notice">Preview only. Camera verification and attendance recording are not connected in this deployment.</div>
    <a href="index.html">Return to sign in</a>
  </main>

</html>
